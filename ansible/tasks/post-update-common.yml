---
- name: Ensure the system group 'haclient' exists
  ansible.builtin.group:
    name: haclient
    state: present
    gid: "{{ haclient_group_id | default(omit) }}"
    system: true

- name: Ensure the system user 'hacluster' exists
  ansible.builtin.user:
    name: hacluster
    state: present
    system: true
    group: haclient
    uid: "{{ haclient_user_id | default(omit) }}"
    comment: "cluster user"
    create_home: false
