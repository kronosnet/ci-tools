---
- name: Install Red Hat IT Root CA certificate where needed
  when:
    - inventory_hostname.startswith('rhel-') or
      inventory_hostname.startswith('vapor-')
  block:
    - name: Download RH IT Root CA certificate
      ansible.builtin.get_url:
        url: https://certs.corp.redhat.com/certs/Current-IT-Root-CAs.pem
        dest: /etc/pki/ca-trust/source/anchors/RH-IT-Root-CA.crt
        validate_certs: false
        mode: '0644'

  # Rescue block for urllib3 compatibility issue on control node (RHEL 9 Python 3.9).
  # Else tasks on RHEL 10 targets will fail with:
  #   An unknown error occurred: HTTPSConnection.__init__() got an unexpected keyword argument 'cert_file'"
  # See https://github.com/ansible/ansible/issues/80490
  # Safe to remove when: control node upgraded to RHEL 10+ OR ansible/urllib3 packages updated
  rescue:
    - name: Download RH IT Root CA certificate using wget (urllib3 workaround)
      ansible.builtin.shell:
        cmd: wget --no-check-certificate -O /etc/pki/ca-trust/source/anchors/RH-IT-Root-CA.crt https://certs.corp.redhat.com/certs/Current-IT-Root-CAs.pem
  always:
    - name: Update CA trust store
      ansible.builtin.command: update-ca-trust
      changed_when: false
