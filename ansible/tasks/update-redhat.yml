- name: Install required packages
  ansible.builtin.dnf:
    name: "{{ required_packages }}"
    state: present

- name: Install optional packages
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop: "{{ optional_packages }}"
  failed_when: false

- name: Setup kcli
  when: inventory_hostname.startswith('vapor-') or
        inventory_hostname.startswith('anvil-ci-')
  block:
    - name: Enable karmab/kcli copr
      community.general.copr:
        host: copr.fedorainfracloud.org
        name: karmab/kcli
        state: enabled

    - name: Enable broken epel-9 builds on copr
      ansible.builtin.replace:
        path: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:karmab:kcli.repo
        regexp: 'epel'
        replace: 'centos-stream'

    - name: Install kcli
      ansible.builtin.dnf:
        name: kcli
        state: present

- name: Handle Vapor specific tasks
  when: inventory_hostname.startswith('vapor-')
  block:
    # Split to 3 tasks?
    # 1) fetch but it is ok to fail (in case github is down?)
    # 2) store in a specific directory
    # 3) run (either the new or the pre-existing if failed)
    - name: Install Aliyun CLI  # or update if it exists - the script handles that
      ansible.builtin.shell:
        cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/aliyun/aliyun-cli/HEAD/install.sh)"

    - name: Check if ibmcloud is installed
      ansible.builtin.command: which ibmcloud
      register: ibmcloud_check
      failed_when: false
      changed_when: false

    # Split this task the same as above with aliyun cli if ibmcloud doesn't exist?
    - name: Install IBM Cloud CLI
      when: ibmcloud_check.rc != 0
      ansible.builtin.shell:
        cmd: curl -fsSL https://clis.cloud.ibm.com/install/linux | sh

    - name: Update IBM Cloud CLI
      ansible.builtin.command: ibmcloud update -f

    - name: Install libvirt-daemon
      ansible.builtin.dnf:
        name: libvirt-daemon
        state: present

    - name: Ensure kubesan group exists
      ansible.builtin.group:
        name: kubesan
        system: true
        state: present

    - name: Ensure kubesan user exists
      ansible.builtin.user:
        name: kubesan
        group: kubesan
        groups: libvirt
        create_home: true
        state: present

    - name: Set ACL for kubesan on libvirt images directory
      ansible.posix.acl:
        path: /var/lib/libvirt/images
        entity: kubesan
        etype: user
        permissions: rwx
        state: present

# Isn't that an one time command? I don't think it needs to be run everytime a shell is started.
#   if ! grep -q enable-linger /home/kubesan/.bashrc; then
#    echo 'loginctl enable-linger $UID' >> /home/kubesan/.bashrc
#   fi
#
# In which case the task should be something like:
#
    # - name: Enable loginctl linger for kubesan user
    #   ansible.builtin.command: loginctl enable-linger kubesan
    #   args:
    #     creates: /var/lib/systemd/linger/kubesan

    - name: Create the .ssh directory for the kubesan user if it does not exist
      ansible.builtin.file:
        path: /home/kubesan/.ssh
        state: directory
        mode: '0700'

