- name: Enable --nobest for Anvil, CentOS 10 and RHEL 10
  when: inventory_hostname.startswith('anvil-') or
        inventory_hostname.startswith('centos-10-') or
        inventory_hostname.startswith('rhel-10-')
  ansible.builtin.set_fact:
    use_no_best: true

- name: Handle RHEL 9 quirks
  when: inventory_hostname.startswith('rhel-9-') or
        inventory_hostname.startswith('vapor-')
  block:
    # The ansible.builtin.dnf module doesn't currently support managing module streams.
    - name: Enable ruby 3.1
      ansible.builtin.command: yum -y module enable ruby:3.1
      changed_when: false

    - name: Expand requred_packages variable with RHEL 9 extras
      ansible.builtin.set_fact:
        required_packages: "{{ required_packages + rhel_9_extra_required_packages }}"

