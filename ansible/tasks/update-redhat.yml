- name: Handle RHEL 9 quirks
  when: inventory_hostname.startswith('rhel-9-') or
        inventory_hostname.startswith('vapor-')
  block:
    # The ansible.builtin.dnf module doesn't currently support managing module streams.
    - name: Enable ruby 3.1
      ansible.builtin.command: yum -y module enable ruby:3.1
      changed_when: false

    - name: Expand requred_packages variable with RHEL 9 extras
      ansible.builtin.set_fact:
        required_packages: "{{ required_packages + rhel_9_extra_required_packages }}"

- name: Enable --nobest for Anvil, CentOS 10 and RHEL 10
  when: inventory_hostname.startswith('anvil-') or
        inventory_hostname.startswith('centos-10-') or
        inventory_hostname.startswith('rhel-10-')
  ansible.builtin.set_fact:
    use_no_best: true

# Q: What does POSTOPTS do in `yum -y $EXTRAOPTS update $POSTOPTS`?
- name: Upgrade all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    nobest: "{{ use_no_best | default(false) }}"

# case "${NODE_NAME}" in
#  centos*|rhel*|anvil-ci-centos*|anvil-ci-rhel*|anvil-ci-alma*|vapor*)
#   required_pkg platform-python-devel
#  ;;
# esac

- name: Add anvil CI required packages
  when: inventory_hostname.startswith('anvil-ci-')
  ansible.builtin.set_fact:
    required_packages: "{{ required_packages + ['fence-agents-common', 'resource-agents', 'selinux-policy-devel'] }}"

- name: Add rust bindings
  when: lookup('ansible.builtin.env', 'RUSTBINDINGS') == 'yes'
  ansible.builtin.set_fact:
    required_packages: "{{ required_packages + rust_bindings }}"

- name: Add shellcheck for resource-agents ci/build.sh
  when: inventory_hostname.startswith('fedora-')
  ansible.builtin.set_fact:
    required_packages: "{{ required_packages + 'ShellCheck' }}"

# annobin-annocheck is off sync on rhel-8 power
- name: Add annobin-annocheck for non-power machines
  when: "'power' not in inventory_hostname"
  ansible.builtin.set_fact:
    required_packages: "{{ required_packages + 'annobin-annocheck' }}"

