---
# https://github.com/kronosnet/ci-tools/blob/ca139bd587a57862433bac98dc9d9ccbc6fa3fcc/ci-update-apt#L133-L139
- name: Exclude systemd-dev from Ubuntu 22.04
  ansible.builtin.set_fact:
    required_packages: "{{ required_packages | reject('equalto', 'systemd-dev') | list }}"
  when:
    - ansible_distribution_version == '22.04'

# Ansble's apt module doesn't have a way to pass or configure `--allow-releaseinfo-change`.
# We need that to handle repository metadata changes between updates on Ubuntu devel.
- name: Allow release info changes in devel machine
  ansible.builtin.copy:
    content: 'Acquire::AllowReleaseInfoChange "true";\n'
    dest: /etc/apt/apt.conf.d/99allow-releaseinfo-change
    mode: '0644'
  when:
    - "'devel' in inventory_hostname | lower"

- name: Manage packages
  environment:
    DEBIAN_FRONTEND: noninteractive
  block:
    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        update_cache: true

    - name: Install required packages
      ansible.builtin.apt:
        name: "{{ required_packages }}"
        state: present

    - name: Install optional packages
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      loop: "{{ optional_packages }}"
      failed_when: false

- name: Clean apt cache
  ansible.builtin.apt:
    clean: true
