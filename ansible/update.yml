---
- name: Update the servers
  hosts: all

  tasks:

    - name: Include distro-specific pre-update tasks (if exists)
      ansible.builtin.include_tasks:
        file: "{{ item }}"
      with_first_found:
        - files:
            - "tasks/pre-update-{{ ansible_distribution | lower }}.yml"
          skip: true

    - name: Include common pre-update tasks
      ansible.builtin.include_tasks: "tasks/pre-update-common.yml"

    - name: Include distro-specific update tasks
      ansible.builtin.include_tasks: "tasks/update-{{ ansible_distribution | lower }}.yml"

    - name: Reboot system after updates
      ansible.builtin.reboot:
        reboot_timeout: 900
        post_reboot_delay: 120
      when: not inventory_hostname.startswith('anvil-')

    - name: Include common post-update tasks
      ansible.builtin.include_tasks: "tasks/post-update-common.yml"

    - name: Include distro-specific post-update tasks (if exists)
      ansible.builtin.include_tasks:
        file: "{{ item }}"
      with_first_found:
        - files:
            - "tasks/post-update-{{ ansible_distribution | lower }}.yml"
          skip: true
